<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const TASKS = [
  { id:'diet',  label:'Follow the diet (no cheats, no alcohol)' },
  { id:'work1', label:'45-min workout #1' },
  { id:'work2', label:'45-min workout #2 (outdoors)' },
  { id:'water', label:'Drink 1 gallon of water' },
  { id:'read',  label:'Read 10 pages (non-fiction)' },
  { id:'photo', label:'Take a progress photo' },
];
const COLORS=['#ff3b1d','#ffd400','#2ecc71','#3498db','#9b59b6','#e67e22','#1ab7c5','#ff6fae'];
const todayKey=()=>new Date().toISOString().slice(0,10);

function dayNumber(startISO){
  if(!startISO) return 1;
  const start=new Date(startISO+'T00:00:00');
  const now=new Date(todayKey()+'T00:00:00');
  const diff=Math.floor((now-start)/86400000);
  return Math.min(75,Math.max(1,diff+1));
}

function calcStreak(history){
  const sorted=[...history].sort((a,b)=>b.day_key.localeCompare(a.day_key));
  let streak=0;
  let check=new Date(todayKey()+'T00:00:00');
  for(const h of sorted){
    const ds=check.toISOString().slice(0,10);
    if(h.day_key===ds&&TASKS.every(t=>h.tasks?.[t.id])){
      streak++;
      check.setDate(check.getDate()-1);
    } else if(h.day_key<ds){
      break;
    }
  }
  return streak;
}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

const configured = SUPABASE_URL && !SUPABASE_URL.includes("PASTE") && SUPABASE_ANON && !SUPABASE_ANON.includes("PASTE");
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

/* ── History Grid ───────────────────────────────────────────── */
function HistoryGrid({ member, history }){
  const start=new Date(member.start_date+'T00:00:00');
  const today=new Date(todayKey()+'T00:00:00');
  const totalDays=Math.min(75,Math.floor((today-start)/86400000)+1);
  const map={};
  history.forEach(h=>{ map[h.day_key]=h.tasks||{}; });
  const days=[];
  for(let i=0;i<totalDays;i++){
    const d=new Date(start);
    d.setDate(d.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const tasks=map[key]||null;
    const done=tasks?TASKS.filter(t=>tasks[t.id]).length:0;
    days.push({key,dayNum:i+1,done,checked:!!tasks});
  }
  function cellColor(d){
    if(!d.checked) return '#1c1c1c';
    if(d.done===TASKS.length) return 'var(--green)';
    if(d.done>=4) return '#2980b9';
    if(d.done>=2) return 'var(--accent-2)';
    return 'var(--accent)';
  }
  return (
    <div>
      <div className="history-grid">
        {days.map(d=>(
          <div key={d.key} className="history-cell"
            title={`Day ${d.dayNum}: ${d.checked?d.done+'/'+TASKS.length+' tasks':'No check-in'}`}
            style={{background:cellColor(d),opacity:d.checked?1:0.35}}>
            {d.dayNum}
          </div>
        ))}
      </div>
      <div className="history-legend">
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--green)'}}></div>All 6</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#2980b9'}}></div>4–5</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--accent-2)'}}></div>2–3</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--accent)'}}></div>0–1</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#1c1c1c',opacity:.7}}></div>No check-in</div>
      </div>
    </div>
  );
}

/* ── Profile View ───────────────────────────────────────────── */
function ProfileView({ member, todayProgress, history, historyLoading, onBack }){
  const todayTasks=todayProgress||{};
  const todayDone=TASKS.filter(t=>todayTasks[t.id]).length;
  const totalDays=dayNumber(member.start_date);
  const perfectDays=history.filter(h=>TASKS.every(t=>h.tasks?.[t.id])).length;
  const consistency=totalDays>0?Math.round(perfectDays/totalDays*100):0;
  const streak=calcStreak(history);
  const noCheckin=!todayProgress;

  return (
    <div className="wrap">
      <button className="back-btn" onClick={onBack}>← Back</button>
      <div className="profile-header">
        <div className="avatar big-avatar" style={{background:member.color}}>{member.name[0].toUpperCase()}</div>
        <div>
          <div className="profile-name">{member.name}</div>
          <div className="profile-day">Day {dayNumber(member.start_date)} / 75</div>
        </div>
      </div>
      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-num" style={{color:'var(--accent-2)'}}>{streak}</div>
          <div className="stat-label">🔥 Streak</div>
        </div>
        <div className="stat-card">
          <div className="stat-num" style={{color:'var(--green)'}}>{perfectDays}</div>
          <div className="stat-label">Perfect Days</div>
        </div>
        <div className="stat-card">
          <div className="stat-num">{consistency}%</div>
          <div className="stat-label">Consistency</div>
        </div>
        <div className="stat-card">
          <div className="stat-num" style={{color:todayDone===TASKS.length?'var(--green)':todayDone===0?'var(--accent)':'var(--txt)'}}>{todayDone}/6</div>
          <div className="stat-label">Today</div>
        </div>
      </div>
      <div className="section-title">Today's Tasks</div>
      {noCheckin&&<div className="stale" style={{marginBottom:'12px'}}>⚠ Hasn't checked in today yet</div>}
      <div className="profile-tasks" style={{marginBottom:'26px'}}>
        {TASKS.map(t=>{
          const done=!!todayTasks[t.id];
          return (
            <div key={t.id} className={'profile-task'+(done?' done':'')}>
              <div className="check" style={{flexShrink:0,width:'22px',height:'22px',borderRadius:'6px',border:'2px solid '+(done?'var(--green)':'var(--muted)'),background:done?'var(--green)':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
                {done&&<svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5" width="13" height="13"><path d="M5 13l4 4L19 7" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </div>
              <span className="label">{t.label}</span>
            </div>
          );
        })}
      </div>
      <div className="section-title">Activity History</div>
      {historyLoading
        ? <div className="loading" style={{padding:'20px'}}>Loading history…</div>
        : <HistoryGrid member={member} history={history}/>
      }
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────── */
function App(){
  const [me,setMe]=useState(null);
  const [members,setMembers]=useState([]);
  const [progress,setProgress]=useState({});
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState(false);

  // Gate screens: 'home' | 'create' | 'verify' | 'set-pin'
  const [screen,setScreen]=useState('home');
  const [nameInput,setNameInput]=useState('');
  const [startInput,setStartInput]=useState(todayKey());
  const [pinInput,setPinInput]=useState('');
  const [confirmPin,setConfirmPin]=useState('');
  const [pinError,setPinError]=useState('');
  const [gateTarget,setGateTarget]=useState(null); // existing member for verify/set-pin

  // Profile
  const [viewProfile,setViewProfile]=useState(null);
  const [memberHistory,setMemberHistory]=useState([]);
  const [historyLoading,setHistoryLoading]=useState(false);

  const loadAll=useCallback(async()=>{
    if(!sb) return;
    const { data:mem }=await sb.from('members').select('*');
    setMembers(mem||[]);
    const { data:prog }=await sb.from('progress').select('*').eq('day_key',todayKey());
    const map={};
    (prog||[]).forEach(p=>{ map[p.name]=p.tasks||{}; });
    setProgress(map);
  },[]);

  // Initial load + session restore
  useEffect(()=>{
    if(!sb){ setLoading(false); return; }
    (async()=>{
      const savedName=localStorage.getItem('me75');
      const savedAuth=localStorage.getItem('me75_auth');
      const { data:mem }=await sb.from('members').select('*');
      setMembers(mem||[]);
      const { data:prog }=await sb.from('progress').select('*').eq('day_key',todayKey());
      const map={};
      (prog||[]).forEach(p=>{ map[p.name]=p.tasks||{}; });
      setProgress(map);
      if(savedName){
        const member=(mem||[]).find(m=>m.name===savedName);
        if(member){
          if(!member.pin_hash){
            // Legacy account, no PIN yet — still let them in
            setMe(savedName);
          } else if(savedAuth&&savedAuth===member.pin_hash){
            // Valid remembered session
            setMe(savedName);
          } else {
            // PIN set but no valid auth token — require PIN on next load
            localStorage.removeItem('me75');
            localStorage.removeItem('me75_auth');
          }
        } else {
          localStorage.removeItem('me75');
          localStorage.removeItem('me75_auth');
        }
      }
      setLoading(false);
    })();

    const ch=sb.channel('room')
      .on('postgres_changes',{event:'*',schema:'public',table:'progress'},loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'members'},loadAll)
      .subscribe();
    const poll=setInterval(loadAll,15000);
    return ()=>{ sb.removeChannel(ch); clearInterval(poll); };
  },[loadAll]);

  function resetGate(){
    setScreen('home');
    setNameInput('');
    setPinInput('');
    setConfirmPin('');
    setPinError('');
    setGateTarget(null);
  }

  function doLogin(name,pinHash){
    localStorage.setItem('me75',name);
    localStorage.setItem('me75_auth',pinHash);
    setMe(name);
    resetGate();
  }

  function doLogout(){
    localStorage.removeItem('me75');
    localStorage.removeItem('me75_auth');
    setMe(null);
    resetGate();
  }

  // Home: user typed a name and hit Continue
  async function handleContinue(){
    const name=nameInput.trim();
    if(!name) return;
    const existing=members.find(m=>m.name.toLowerCase()===name.toLowerCase());
    setPinInput(''); setConfirmPin(''); setPinError('');
    if(existing){
      setGateTarget(existing);
      setScreen(existing.pin_hash?'verify':'set-pin');
    } else {
      setGateTarget(null);
      setScreen('create');
    }
  }

  // Home: clicked an existing member pill
  function handlePillClick(member){
    setNameInput(member.name);
    setGateTarget(member);
    setPinInput(''); setConfirmPin(''); setPinError('');
    setScreen(member.pin_hash?'verify':'set-pin');
  }

  // Create: new account with PIN
  async function handleCreate(){
    if(!pinInput){ setPinError('Enter a PIN'); return; }
    if(pinInput.length<4){ setPinError('PIN must be at least 4 characters'); return; }
    if(pinInput!==confirmPin){ setPinError("PINs don't match"); return; }
    setBusy(true); setPinError('');
    const name=nameInput.trim();
    const hash=await sha256(pinInput);
    const color=COLORS[members.length%COLORS.length];
    await sb.from('members').upsert({name,color,start_date:startInput,pin_hash:hash},{onConflict:'name'});
    await loadAll();
    doLogin(name,hash);
    setBusy(false);
  }

  // Verify: returning user enters PIN
  async function handleVerify(){
    if(!pinInput){ setPinError('Enter your PIN'); return; }
    setBusy(true); setPinError('');
    const hash=await sha256(pinInput);
    if(hash===gateTarget.pin_hash){
      doLogin(gateTarget.name,hash);
    } else {
      setPinError('Incorrect PIN — try again');
      setPinInput('');
    }
    setBusy(false);
  }

  // Set-pin: legacy user securing their account
  async function handleSetPin(){
    if(!pinInput){ setPinError('Enter a PIN'); return; }
    if(pinInput.length<4){ setPinError('PIN must be at least 4 characters'); return; }
    if(pinInput!==confirmPin){ setPinError("PINs don't match"); return; }
    setBusy(true); setPinError('');
    const hash=await sha256(pinInput);
    await sb.from('members').update({pin_hash:hash}).eq('name',gateTarget.name);
    await loadAll();
    doLogin(gateTarget.name,hash);
    setBusy(false);
  }

  async function toggle(taskId){
    if(!sb) return;
    const tk=todayKey();
    const current={...(progress[me]||{})};
    current[taskId]=!current[taskId];
    setProgress(p=>({...p,[me]:current}));
    await sb.from('progress').upsert(
      {name:me,day_key:tk,tasks:current,updated_at:new Date().toISOString()},
      {onConflict:'name,day_key'}
    );
  }

  async function openProfile(member){
    setViewProfile(member);
    setHistoryLoading(true);
    const { data }=await sb.from('progress').select('*').eq('name',member.name).order('day_key',{ascending:true});
    setMemberHistory(data||[]);
    setHistoryLoading(false);
  }

  /* ── Render ── */

  if(!configured){
    return (
      <div className="config-error">
        <h2>SETUP NEEDED</h2>
        <p>Replace <code>PASTE_YOUR_SUPABASE_URL_HERE</code> and <code>PASTE_YOUR_ANON_KEY_HERE</code> near
        the top of this file with the values from Supabase → Project Settings → API.</p>
      </div>
    );
  }

  if(loading) return <div className="loading">Loading the crew…</div>;

  /* ── Gate ── */
  if(!me){
    return (
      <div className="wrap">
        <div className="gate">

          {screen==='home'&&(
            <>
              <h2>JOIN THE GRIND</h2>
              <p>Type your name to create an account or sign back in. Your crew sees your daily checklist live.</p>
              <label>Your name</label>
              <input type="text" value={nameInput} placeholder="e.g. Brandon"
                onChange={e=>setNameInput(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleContinue()}
                autoFocus/>
              <button className="btn" onClick={handleContinue}>Continue</button>
              {members.length>0&&(
                <div className="existing">
                  <label>Returning? Tap your name</label>
                  {members.map(m=>(
                    <span key={m.name} className="pill" onClick={()=>handlePillClick(m)}>{m.name}</span>
                  ))}
                </div>
              )}
            </>
          )}

          {screen==='create'&&(
            <>
              <button className="gate-back" onClick={()=>{ setScreen('home'); setPinInput(''); setConfirmPin(''); setPinError(''); }}>← Back</button>
              <h2>CREATE ACCOUNT</h2>
              <p>Set a PIN to protect your account. You'll need it on new devices.</p>
              <label>Name</label>
              <input type="text" value={nameInput} readOnly/>
              <label>Your start date</label>
              <input type="date" value={startInput} onChange={e=>setStartInput(e.target.value)}/>
              <label>Create PIN (min 4 characters)</label>
              <input type="password" value={pinInput} placeholder="••••••"
                onChange={e=>setPinInput(e.target.value)} autoFocus/>
              <label>Confirm PIN</label>
              <input type="password" value={confirmPin} placeholder="••••••"
                onChange={e=>setConfirmPin(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleCreate()}/>
              {pinError&&<div className="pin-error">{pinError}</div>}
              <button className="btn" disabled={busy} onClick={handleCreate}>
                {busy?'Creating…':'Create Account'}
              </button>
            </>
          )}

          {screen==='verify'&&(
            <>
              <button className="gate-back" onClick={()=>{ setScreen('home'); setPinInput(''); setPinError(''); }}>← Back</button>
              <h2>WELCOME BACK</h2>
              <p>Enter your PIN to sign in as <strong style={{color:'var(--txt)'}}>{gateTarget?.name}</strong>.</p>
              <label>PIN</label>
              <input type="password" value={pinInput} placeholder="••••••"
                onChange={e=>setPinInput(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleVerify()}
                autoFocus/>
              {pinError&&<div className="pin-error">{pinError}</div>}
              <button className="btn" disabled={busy} onClick={handleVerify}>
                {busy?'Verifying…':'Sign In'}
              </button>
            </>
          )}

          {screen==='set-pin'&&(
            <>
              <button className="gate-back" onClick={()=>{ setScreen('home'); setPinInput(''); setConfirmPin(''); setPinError(''); }}>← Back</button>
              <h2>SECURE YOUR ACCOUNT</h2>
              <p>Hey <strong style={{color:'var(--txt)'}}>{gateTarget?.name}</strong>! Create a PIN so only you can access your account from new devices.</p>
              <label>Create PIN (min 4 characters)</label>
              <input type="password" value={pinInput} placeholder="••••••"
                onChange={e=>setPinInput(e.target.value)} autoFocus/>
              <label>Confirm PIN</label>
              <input type="password" value={confirmPin} placeholder="••••••"
                onChange={e=>setConfirmPin(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleSetPin()}/>
              {pinError&&<div className="pin-error">{pinError}</div>}
              <button className="btn" disabled={busy} onClick={handleSetPin}>
                {busy?'Saving…':'Set PIN & Sign In'}
              </button>
            </>
          )}

        </div>
      </div>
    );
  }

  /* ── Profile view ── */
  if(viewProfile){
    return (
      <ProfileView
        member={viewProfile}
        todayProgress={progress[viewProfile.name]||null}
        history={memberHistory}
        historyLoading={historyLoading}
        onBack={()=>{ setViewProfile(null); setMemberHistory([]); }}
      />
    );
  }

  /* ── Main view ── */
  const meEntry=members.find(m=>m.name===me)||{};
  const myTasks=progress[me]||{};
  const others=members.filter(m=>m.name!==me);

  return (
    <div className="wrap">
      <div className="topbar">
        <div className="logo">
          <div className="num">SUMMER <em>HARD!!!</em></div>
          <div className="sub"><span className="livedot"></span>LIVE</div>
        </div>
        <div className="whoami">
          you are<b>{me}</b>
          <button className="profile-link" onClick={()=>openProfile(meEntry)}>my profile</button>
          <button onClick={doLogout}>sign out</button>
        </div>
      </div>

      <div className="myday">
        <div className="hd">
          <h3>Today's Checklist</h3>
          <span className="daybadge">DAY {dayNumber(meEntry.start_date)} / 75</span>
        </div>
        <div className="tasks">
          {TASKS.map(t=>{
            const done=!!myTasks[t.id];
            return (
              <div key={t.id} className={'task'+(done?' done':'')} onClick={()=>toggle(t.id)}>
                <div className="check">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5">
                    <path d="M5 13l4 4L19 7" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
                <span className="label">{t.label}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="section-title">The Crew Today</div>
      <div className="crew">
        {others.length===0&&(
          <div className="empty">No one else has joined yet. Send your friends the link and have them pick a name.</div>
        )}
        {others.map(m=>{
          const t=progress[m.name]||{};
          const done=TASKS.filter(x=>t[x.id]).length;
          const pct=Math.round(done/TASKS.length*100);
          const noCheckin=!progress[m.name];
          return (
            <div key={m.name} className="friend" onClick={()=>openProfile(m)}>
              <div className="top">
                <div className="who">
                  <div className="avatar" style={{background:m.color}}>{m.name[0].toUpperCase()}</div>
                  <div>
                    <div className="name">{m.name}</div>
                    <div className="streak">Day {dayNumber(m.start_date)} / 75</div>
                  </div>
                </div>
                <div className={'pct '+(pct===100?'full':pct===0?'zero':'')}>{done}/6</div>
              </div>
              <div className="dots">
                {TASKS.map(x=>(
                  <div key={x.id} className={'dot'+(t[x.id]?' on':'')}>
                    <span className="ic"></span>{x.label.split(' ')[0].replace(/[^A-Za-z0-9-]/g,'')}
                  </div>
                ))}
              </div>
              {noCheckin&&<div className="stale">⚠ Hasn't checked in today yet</div>}
            </div>
          );
        })}
      </div>

      <div className="note">
        Live shared tracker — everyone who opens this link and picks a name syncs in real time.<br/>
        Checklists reset each day automatically. Don't break the chain.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
