<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const DEFAULT_TASKS = [
  { id:'diet',  label:'Follow the diet (no cheats, no alcohol)' },
  { id:'work1', label:'45-min workout #1' },
  { id:'work2', label:'45-min workout #2 (outdoors)' },
  { id:'water', label:'Drink 1 gallon of water' },
  { id:'read',  label:'Read 10 pages (non-fiction)' },
  { id:'photo', label:'Take a progress photo' },
];
const COLORS=['#ff3b1d','#ffd400','#2ecc71','#3498db','#9b59b6','#e67e22','#1ab7c5','#ff6fae'];
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const todayKey=()=>new Date().toISOString().slice(0,10);

function getMemberTasks(member){
  return (member?.custom_tasks&&member.custom_tasks.length>0)?member.custom_tasks:DEFAULT_TASKS;
}

function dayNumber(startISO){
  if(!startISO) return 1;
  const start=new Date(startISO+'T00:00:00');
  const now=new Date(todayKey()+'T00:00:00');
  const diff=Math.floor((now-start)/86400000);
  return Math.min(75,Math.max(1,diff+1));
}

function calcStreak(history,tasks){
  const sorted=[...history].sort((a,b)=>b.day_key.localeCompare(a.day_key));
  let streak=0;
  let check=new Date(todayKey()+'T00:00:00');
  for(const h of sorted){
    const ds=check.toISOString().slice(0,10);
    if(h.day_key===ds&&tasks.every(t=>h.tasks?.[t.id])){
      streak++;
      check.setDate(check.getDate()-1);
    } else if(h.day_key<ds){
      break;
    }
  }
  return streak;
}

function calcPerfectDays(history,tasks){
  return history.filter(h=>tasks.every(t=>h.tasks?.[t.id])).length;
}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function dayCompletionColor(done,total){
  if(!total) return '#1c1c1c';
  if(done===total) return 'var(--green)';
  if(done>=Math.ceil(total*.67)) return '#2980b9';
  if(done>=Math.ceil(total*.33)) return 'var(--accent-2)';
  if(done>0) return 'var(--accent)';
  return '#1c1c1c';
}

const ALL_BADGES=[
  {id:'first',    icon:'👟',label:'First Step',    desc:'Logged your first check-in',          check:(m,h,t)=>h.length>0},
  {id:'perfect1', icon:'⭐',label:'Perfect Day',   desc:'Completed all tasks in a single day',  check:(m,h,t)=>calcPerfectDays(h,t)>=1},
  {id:'streak7',  icon:'🔥',label:'Week Warrior',  desc:'7-day perfect streak',                 check:(m,h,t)=>calcStreak(h,t)>=7},
  {id:'halfway',  icon:'🏃',label:'Halfway Hero',  desc:'Reached day 75 of 150',                check:(m,h,t)=>dayNumber(m.start_date)>=75},
  {id:'perfect30',icon:'💪',label:'Iron Will',     desc:'30 perfect days total',                check:(m,h,t)=>calcPerfectDays(h,t)>=30},
  {id:'streak30', icon:'🌋',label:'Month of Fire', desc:'30-day perfect streak',                check:(m,h,t)=>calcStreak(h,t)>=30},
  {id:'champion', icon:'🏆',label:'Champion',      desc:'Completed all 75 days',                check:(m,h,t)=>dayNumber(m.start_date)>=75},
];

const configured = SUPABASE_URL&&!SUPABASE_URL.includes("PASTE")&&SUPABASE_ANON&&!SUPABASE_ANON.includes("PASTE");
const sb = configured ? supabase.createClient(SUPABASE_URL,SUPABASE_ANON) : null;

/* ── Progress Bar ─────────────────────────────────────────── */
function ProgressBar({done,total}){
  const pct=total>0?Math.round(done/total*100):0;
  const color=done===total?'var(--green)':pct>=60?'#2980b9':pct>=30?'var(--accent-2)':'var(--accent)';
  return (
    <div className="prog-bar-wrap">
      <div className="prog-bar-bg">
        <div className="prog-bar-fill" style={{width:pct+'%',background:color}}/>
      </div>
      <div className="prog-bar-label">{done} / {total} tasks complete · {pct}%</div>
    </div>
  );
}

/* ── Week Strip ───────────────────────────────────────────── */
function WeekStrip({history,tasks,liveToday}){
  const map={};
  history.forEach(h=>{map[h.day_key]=h.tasks||{};});
  const tk=todayKey();
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const dow=['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()];
    const rec=key===tk?(liveToday||map[key]||null):(map[key]||null);
    const done=rec?tasks.filter(t=>rec[t.id]).length:0;
    const isToday=key===tk;
    const bg=rec?dayCompletionColor(done,tasks.length):'#1c1c1c';
    days.push({key,dow,done,isToday,bg,rec,date:d.getDate()});
  }
  return (
    <div className="week-strip">
      {days.map(d=>(
        <div key={d.key} className="week-cell"
          style={{background:d.bg,opacity:d.rec?1:0.35,outline:d.isToday?'2px solid var(--accent-2)':'none',outlineOffset:'2px',borderRadius:'8px',padding:'6px 2px',textAlign:'center'}}>
          <div className="wd">{d.dow}</div>
          <div className="dn" style={{color:d.rec?'#fff':'var(--muted)'}}>{d.date}</div>
          {d.rec&&<div className="tc">{d.done}/{tasks.length}</div>}
        </div>
      ))}
    </div>
  );
}

/* ── Month Calendar ───────────────────────────────────────── */
function MonthCalendar({history,tasks,liveToday}){
  const now=new Date();
  const [yr,setYr]=useState(now.getFullYear());
  const [mo,setMo]=useState(now.getMonth());
  const map={};
  history.forEach(h=>{map[h.day_key]=h.tasks||{};});
  const tk=todayKey();
  const atMax=yr===now.getFullYear()&&mo===now.getMonth();
  function prev(){if(mo===0){setYr(y=>y-1);setMo(11);}else setMo(m=>m-1);}
  function next(){if(atMax) return;if(mo===11){setYr(y=>y+1);setMo(0);}else setMo(m=>m+1);}
  const firstDow=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  return (
    <div className="cal-wrap">
      <div className="cal-header">
        <button className="cal-nav" onClick={prev}>‹</button>
        <span className="cal-title">{MONTH_NAMES[mo]} {yr}</span>
        <button className="cal-nav" onClick={next} disabled={atMax}>›</button>
      </div>
      <div className="cal-grid">
        {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=><div key={d} className="cal-dow">{d}</div>)}
        {cells.map((d,i)=>{
          if(!d) return <div key={'e'+i}/>;
          const key=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const rec=key===tk?(liveToday||map[key]||null):(map[key]||null);
          const done=rec?tasks.filter(t=>rec[t.id]).length:0;
          const isPast=key<=tk;
          const isToday=key===tk;
          const bg=rec?dayCompletionColor(done,tasks.length):'#1c1c1c';
          return (
            <div key={key} className={'cal-day'+(isToday?' today':'')}
              title={rec?`${done}/${tasks.length} tasks`:isPast?'No check-in':''}
              style={{background:bg,opacity:rec?1:isPast?0.28:0.08,boxShadow:isToday?'0 0 0 2px var(--accent-2)':undefined}}>
              {d}
            </div>
          );
        })}
      </div>
      <div className="history-legend" style={{marginTop:'12px'}}>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--green)'}}/>All done</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#2980b9'}}/>2/3+</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--accent-2)'}}/>1/3+</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--accent)'}}/>Started</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#1c1c1c',opacity:.7}}/>None</div>
      </div>
    </div>
  );
}

/* ── Task Editor ──────────────────────────────────────────── */
function TaskEditor({tasks,onSave,onCancel,busy,error}){
  const [items,setItems]=useState(()=>tasks.map(t=>({...t})));
  const [dragIdx,setDragIdx]=useState(null);
  const [overIdx,setOverIdx]=useState(null);

  function update(idx,label){setItems(prev=>prev.map((t,i)=>i===idx?{...t,label}:t));}
  function remove(idx){
    setItems(prev=>{
      if(prev.length<=1) return prev;
      return prev.filter((_,i)=>i!==idx);
    });
  }
  function add(){setItems(prev=>[...prev,{id:'task_'+Date.now(),label:''}]);}
  function save(){const valid=items.filter(t=>t.label.trim());if(valid.length) onSave(valid);}

  function onDragStart(e,i){
    setDragIdx(i);
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain',String(i));
  }
  function onDragOver(e,i){
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    if(i!==overIdx) setOverIdx(i);
  }
  function onDrop(e,i){
    e.preventDefault();
    setItems(prev=>{
      if(dragIdx===null||dragIdx===i) return prev;
      const next=[...prev];
      const [moved]=next.splice(dragIdx,1);
      next.splice(i,0,moved);
      return next;
    });
    setDragIdx(null);
    setOverIdx(null);
  }
  function onDragEnd(){setDragIdx(null);setOverIdx(null);}

  return (
    <>
      <div className="task-editor">
        {items.map((t,i)=>{
          const cls='task-edit-row'+(dragIdx===i?' dragging':overIdx===i?' drag-over':'');
          return (
            <div key={t.id} className={cls}
              draggable
              onDragStart={e=>onDragStart(e,i)}
              onDragOver={e=>onDragOver(e,i)}
              onDrop={e=>onDrop(e,i)}
              onDragEnd={onDragEnd}>
              <span className="drag-handle" title="Drag to reorder">⠿</span>
              <input type="text" value={t.label} placeholder="Task description…"
                onChange={e=>update(i,e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&add()}/>
              <button className="task-edit-del" onClick={()=>remove(i)} title="Remove">×</button>
            </div>
          );
        })}
        <button className="task-add-btn" onClick={add}>+ Add task</button>
      </div>
      {error&&<div className="pin-error" style={{marginBottom:'10px'}}>{error}</div>}
      <div className="edit-actions">
        <button className="btn-sm secondary" onClick={onCancel}>Cancel</button>
        <button className="btn-sm primary" disabled={busy} onClick={save}>{busy?'Saving…':'Save Tasks'}</button>
      </div>
    </>
  );
}

/* ── Leaderboard ──────────────────────────────────────────── */
function Leaderboard({members,allHistory,progress,onOpenProfile}){
  const [sort,setSort]=useState('streak');
  const rows=members.map(m=>{
    const tasks=getMemberTasks(m);
    const hist=allHistory[m.name]||[];
    const streak=calcStreak(hist,tasks);
    const perfect=calcPerfectDays(hist,tasks);
    const tp=progress[m.name]||{};
    const todayDone=tasks.filter(t=>tp[t.id]).length;
    return {m,tasks,streak,perfect,todayDone};
  }).sort((a,b)=>{
    if(sort==='streak') return b.streak-a.streak||b.perfect-a.perfect;
    if(sort==='perfect') return b.perfect-a.perfect||b.streak-a.streak;
    return b.todayDone-a.todayDone||b.streak-a.streak;
  });
  const rankClass=i=>i===0?'gold':i===1?'silver':i===2?'bronze':'';
  return (
    <>
      <div className="lb-sort">
        {[['streak','🔥 Streak'],['perfect','⭐ Perfect Days'],['today','📅 Today']].map(([k,l])=>(
          <button key={k} className={'lb-sort-btn'+(sort===k?' on':'')} onClick={()=>setSort(k)}>{l}</button>
        ))}
      </div>
      {rows.map((row,i)=>{
        const val=sort==='streak'?row.streak:sort==='perfect'?row.perfect:(row.todayDone+'/'+row.tasks.length);
        const valColor=sort==='streak'?'var(--accent-2)':sort==='perfect'?'var(--green)':row.todayDone===row.tasks.length?'var(--green)':row.todayDone===0?'var(--accent)':'var(--txt)';
        return (
          <div key={row.m.name} className="lb-row" onClick={()=>onOpenProfile(row.m)}>
            <div className={'lb-rank '+rankClass(i)}>#{i+1}</div>
            <div className="avatar" style={{background:row.m.color}}>{row.m.name[0].toUpperCase()}</div>
            <div className="lb-info">
              <div className="lb-name">{row.m.name}</div>
              <div className="lb-sub">Day {dayNumber(row.m.start_date)}/75 · {row.perfect} perfect days</div>
            </div>
            <div className="lb-val" style={{color:valColor}}>{val}</div>
          </div>
        );
      })}
    </>
  );
}

/* ── History Grid ───────────────────────────────────────────── */
function HistoryGrid({member,history,tasks}){
  const start=new Date(member.start_date+'T00:00:00');
  const today=new Date(todayKey()+'T00:00:00');
  const totalDays=Math.min(75,Math.floor((today-start)/86400000)+1);
  const map={};
  history.forEach(h=>{map[h.day_key]=h.tasks||{};});
  const days=[];
  for(let i=0;i<totalDays;i++){
    const d=new Date(start);
    d.setDate(d.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const rec=map[key]||null;
    const done=rec?tasks.filter(t=>rec[t.id]).length:0;
    days.push({key,dayNum:i+1,done,checked:!!rec});
  }
  return (
    <div>
      <div className="history-grid">
        {days.map(d=>(
          <div key={d.key} className="history-cell"
            title={`Day ${d.dayNum}: ${d.checked?d.done+'/'+tasks.length+' tasks':'No check-in'}`}
            style={{background:d.checked?dayCompletionColor(d.done,tasks.length):'#1c1c1c',opacity:d.checked?1:0.35}}>
            {d.dayNum}
          </div>
        ))}
      </div>
      <div className="history-legend">
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--green)'}}/>All {tasks.length}</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#2980b9'}}/>2/3+</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--accent-2)'}}/>1/3+</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--accent)'}}/>Started</div>
        <div className="legend-item"><div className="legend-dot" style={{background:'#1c1c1c',opacity:.7}}/>None</div>
      </div>
    </div>
  );
}

      hmap[h.name].push(h);
    });

  },[]);

  useEffect(()=>{

    (async()=>{

      const {data:mem}=await sb.from('members').select('*');

          localStorage.removeItem('me75');localStorage.removeItem('me75_auth');
        }
      }
      setLoading(false);
    })();
    const ch=sb.channel('room')
      .on('postgres_changes',{event:'*',schema:'public',table:'progress'},loadAll)
      .on('postgres_changes',{event:'*',schema:'public',table:'members'},loadAll)
      .subscribe();
    const poll=setInterval(loadAll,15000);
    return ()=>{sb.removeChannel(ch);clearInterval(poll);};

              <input type="date" value={startInput} onChange={e=>setStartInput(e.target.value)}/>
              <label>Create PIN (min 4 characters)</label>
              <input type="password" value={pinInput} placeholder="••••••" onChange={e=>setPinInput(e.target.value)} autoFocus/>
              <label>Confirm PIN</label>
              <input type="password" value={confirmPin} placeholder="••••••" onChange={e=>setConfirmPin(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleCreate()}/>
              {pinError&&<div className="pin-error">{pinError}</div>}
              <button className="btn" disabled={busy} onClick={handleCreate}>{busy?'Creating…':'Create Account'}</button>
            </>
          )}
          {screen==='verify'&&(
            <>
              <button className="gate-back" onClick={()=>{setScreen('home');setPinInput('');setPinError('');}}>← Back</button>
              <h2>WELCOME BACK</h2>
              <p>Enter your PIN to sign in as <strong style={{color:'var(--txt)'}}>{gateTarget?.name}</strong>.</p>
              <label>PIN</label>
              <input type="password" value={pinInput} placeholder="••••••" onChange={e=>setPinInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleVerify()} autoFocus/>
              {pinError&&<div className="pin-error">{pinError}</div>}
              <button className="btn" disabled={busy} onClick={handleVerify}>{busy?'Verifying…':'Sign In'}</button>
            </>
          )}
          {screen==='set-pin'&&(
            <>
              <button className="gate-back" onClick={()=>{setScreen('home');setPinInput('');setConfirmPin('');setPinError('');}}>← Back</button>
              <h2>SECURE YOUR ACCOUNT</h2>
              <p>Hey <strong style={{color:'var(--txt)'}}>{gateTarget?.name}</strong>! Create a PIN so only you can access your account from new devices.</p>
              <label>Create PIN (min 4 characters)</label>
              <input type="password" value={pinInput} placeholder="••••••" onChange={e=>setPinInput(e.target.value)} autoFocus/>
              <label>Confirm PIN</label>
              <input type="password" value={confirmPin} placeholder="••••••" onChange={e=>setConfirmPin(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSetPin()}/>
              {pinError&&<div className="pin-error">{pinError}</div>}
              <button className="btn" disabled={busy} onClick={handleSetPin}>{busy?'Saving…':'Set PIN & Sign In'}</button>
            </>
          )}
        </div>
      </div>
    );
  }

  /* ── Profile view ── */
  if(viewProfile){
    return (
      <ProfileView
        member={viewProfile}
        todayProgress={progress[viewProfile.name]||null}
        history={memberHistory}
        historyLoading={historyLoading}
        onBack={()=>{setViewProfile(null);setMemberHistory([]);}}
      />
    );
  }

  /* ── Main view ── */
  const meEntry=members.find(m=>m.name===me)||{};
  const myTasks=getMemberTasks(meEntry);
  const myProgress=progress[me]||{};
  const myDone=myTasks.filter(t=>myProgress[t.id]).length;
  const myHistory=allHistory[me]||[];
  const others=members.filter(m=>m.name!==me);

  return (
    <div className="wrap">
      <div className="topbar">
        <div className="logo">
          <div className="num">SUMMER <em>HARD!!!</em></div>
          <div className="sub"><span className="livedot"/>LIVE</div>
        </div>
        <div className="whoami">
          you are<b>{me}</b>
          <button className="profile-link" onClick={()=>openProfile(meEntry)}>my profile</button>
          <button onClick={doLogout}>sign out</button>
        </div>
      </div>

      <div className="myday">
        <div className="hd">
          <h3>Today's Checklist</h3>
          <div className="hd-right">
            {!editingTasks&&(
              <button className="edit-tasks-btn" onClick={()=>setEditingTasks(true)}>✏ edit tasks</button>
            )}
            <span className="daybadge">DAY {dayNumber(meEntry.start_date)} / 75</span>
          </div>
        </div>

        {editingTasks
          ? <TaskEditor tasks={myTasks} onSave={saveCustomTasks} onCancel={()=>{setEditingTasks(false);setTaskError('');}} busy={taskBusy} error={taskError}/>
          : <>
              <div className="tasks">
                {myTasks.map(t=>{
                  const done=!!myProgress[t.id];
                  return (
                    <div key={t.id} className={'task'+(done?' done':'')} onClick={()=>toggle(t.id)}>
                      <div className="check">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5">
                          <path d="M5 13l4 4L19 7" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                      </div>
                      <span className="label">{t.label}</span>
                    </div>
                  );
                })}
              </div>
              <ProgressBar done={myDone} total={myTasks.length}/>
              <WeekStrip history={myHistory} tasks={myTasks} liveToday={myProgress}/>
            </>
        }
      </div>

      <button className={'toggle-btn'+(showCal?' on':'')} onClick={()=>setShowCal(s=>!s)}>
        📅 {showCal?'Hide':'Show'} Monthly Calendar
      </button>
      {showCal&&<MonthCalendar history={myHistory} tasks={myTasks} liveToday={myProgress}/>}

      <div className="crew-header">
        <div className="section-title" style={{margin:0}}>The Crew</div>
        <div className="tab-row">
          <button className={'tab-btn'+(mainTab==='crew'?' on':'')} onClick={()=>setMainTab('crew')}>Today</button>
          <button className={'tab-btn'+(mainTab==='lb'?' on':'')} onClick={()=>setMainTab('lb')}>Leaderboard</button>
        </div>
      </div>

      {mainTab==='crew'&&(
        <div className="crew">
          {others.length===0&&(
            <div className="empty">No one else has joined yet. Send your friends the link and have them pick a name.</div>
          )}
          {others.map(m=>{
            const mTasks=getMemberTasks(m);
            const t=progress[m.name]||{};
            const done=mTasks.filter(x=>t[x.id]).length;
            const pct=Math.round(done/mTasks.length*100);
            const noCheckin=!progress[m.name];
            return (
              <div key={m.name} className="friend" onClick={()=>openProfile(m)}>
                <div className="top">
                  <div className="who">
                    <div className="avatar" style={{background:m.color}}>{m.name[0].toUpperCase()}</div>
                    <div>
                      <div className="name">{m.name}</div>
                      <div className="streak">Day {dayNumber(m.start_date)} / 75</div>
                    </div>
                  </div>
                  <div className={'pct '+(pct===100?'full':pct===0?'zero':'')}>{done}/{mTasks.length}</div>
                </div>
                <div className="dots">
                  {mTasks.map(x=>(
                    <div key={x.id} className={'dot'+(t[x.id]?' on':'')}>
                      <span className="ic"/>
                      {x.label.split(' ')[0].replace(/[^A-Za-z0-9-]/g,'')}
                    </div>
                  ))}
                </div>
                {noCheckin&&<div className="stale">⚠ Hasn't checked in today yet</div>}
              </div>
            );
          })}
        </div>
      )}

      {mainTab==='lb'&&(
        <Leaderboard members={members} allHistory={allHistory} progress={progress} onOpenProfile={openProfile}/>
      )}

      <div className="note">
        Live shared tracker — everyone who opens this link and picks a name syncs in real time.<br/>
        Checklists reset each day automatically. Don't break the chain.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
